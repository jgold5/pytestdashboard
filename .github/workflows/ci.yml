name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  check:
    name: Lint, typecheck, test, build, audit, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from packageManager)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Install Playwright browser
        # The browser comes from Playwright's CDN. Its system packages come from the Ubuntu mirror,
        # and the runner image already has the libraries (what's left is mostly fonts, which the e2e
        # tests don't need: no screenshot comparisons). When the mirror is unreachable, apt hangs for
        # 10+ minutes and fails the run, so cap it and carry on with a warning; a library that is
        # really missing still fails the E2E step itself, with the browser's own error.
        run: |
          pnpm exec playwright install chromium
          if ! timeout 180 pnpm exec playwright install-deps chromium; then
            echo "::warning title=Playwright system packages::Not installed (Ubuntu package mirror unreachable or too slow); running the e2e tests without them."
          fi

      - name: E2E
        run: pnpm e2e
        env:
          E2E_SKIP_BUILD: '1' # reuse the build from the step above

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
