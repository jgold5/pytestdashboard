name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  check:
    name: Lint, typecheck, test, build, audit, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from packageManager)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Install Playwright browser
        # Only the browser, from Playwright's CDN (~10 s). Not its system packages (`--with-deps` /
        # `install-deps`): those come from the Ubuntu mirror, which can be unreachable and then hangs
        # the run for 10+ minutes, and the runner image already has the libraries (what --with-deps
        # adds is fonts, which the e2e tests don't need: no screenshot comparisons). If a library ever
        # goes missing from the image, the E2E step fails at once with Playwright's own message.
        run: pnpm exec playwright install chromium

      - name: E2E
        run: pnpm e2e
        env:
          E2E_SKIP_BUILD: '1' # reuse the build from the step above

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
